[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
axum = { version = "0.8.9", features = ["macros", "tokio"] }
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
percent-encoding = "2.3.2"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["form", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
