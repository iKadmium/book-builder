[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["tokio"] }
chrono = { version = "0.4.45", features = ["serde"] }
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
lettre = { version = "0.11.22", features = ["smtp-transport", "builder", "tokio1-rustls-tls", "tokio1-native-tls"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
